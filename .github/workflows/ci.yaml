name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  ci:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Jar
        run: mvn clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-app:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-app:${{ github.sha }}

  cd:
    name: Update Deployment Repository
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout Deployment Repository
        uses: actions/checkout@v4
        with:
          repository: barath-bmwtechworks/kube-deployment
          token: ${{ secrets.GH_PAT }}
          path: deployment

      - name: Update Image Tag  
        run: |
          cd deployment

          sed -i "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/spring-app:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Commit Changes
        run: |
          cd deployment

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add k8s/deployment.yaml

          git diff --staged --quiet || git commit -m "Update image tag to ${{ github.sha }}"

          git push